<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="styles.css">
    <script src="texts.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body data-page="home">
    <main class="container">
        <h1 data-text="heading" dir="auto"></h1>

        <div class="buttons">
            <button
                class="yes-button"
                type="button"
                data-text="yesButton"
                dir="auto"
                onclick="handleYesClick()"
            ></button>

            <button
                class="no-button"
                type="button"
                data-text="noButton"
                dir="auto"
                onclick="handleNoClick()"
            ></button>
        </div>

        <div class="gif_container">
            <img
                src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExbW5lenZyZHI5OXM2eW95b3pmMG40cWVrMDhtNjVuM3A4dGNxa2g2dSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/VM1fcpu2bKs1e2Kdbj/giphy.gif"
                data-text-alt="imageAlt"
                alt=""
            >
        </div>
    </main>
</body>
</html>
